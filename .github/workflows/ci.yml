name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Package tests (macOS) and iOS build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Choose the newest Xcode
        # The same line as PARAGON's workflows: the runner carries several Xcodes, and the
        # newest one knows the newest SF Symbols, which the symbol test asks the system about.
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        # On macOS the symbol test asks the system for every SF Symbol in the catalog, so a
        # misspelt name or one newer than macOS 14 turns this step red.
        run: swift test

      - name: Build for iOS Simulator
        # swift test only builds for the Mac. The views have iPhone-only code (UIKit), and
        # this is the step that compiles it.
        run: |
          set -o pipefail
          xcodebuild -scheme AMSIcons -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-ios.log | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-ios.log
